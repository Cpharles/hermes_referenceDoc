services:
  hermes:
    build:
      context: .
      dockerfile: hermes-gh.Dockerfile
      container_name: hermes
    # image: nousresearch/hermes-agent:v0.23.1
    restart: unless-stopped
    command: gateway run
    ports:
      - "9119:9119"   # Dashboard (acesso local via navegador)
      - "8642:8642"   # Gateway API (opcional, para clientes externos)
      - "27890:27890" # Google Chat Callback
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - API_SERVER_ENABLED=${API_SERVER_ENABLED}
      - API_SERVER_HOST=${API_SERVER_HOST}
      - API_SERVER_KEY=${API_SERVER_KEY}
      - GH_TOKEN=${GH_TOKEN}   # para usar no GitHub CLI
      - TZ=America/Sao_Paulo   # fuso horário do container
      - HERMES_TIMEZONE=America/Sao_Paulo   # fuso horário para o Hermes
    volumes:
      - hermes_data:/opt/data
      - /mnt/vbox_global:/opt/data/workspace/rodentiavet # compartilhamento da pasta da VM com o container (somente para aplicação homelab local)

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  hermes_data: