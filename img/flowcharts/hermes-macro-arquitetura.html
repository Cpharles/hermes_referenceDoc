<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes seguro · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Conceito macro</p>
    <h1>O Desktop é o controle remoto; o agente fica confinado no container</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hermes-macro-title hermes-macro-desc">
        <title id="hermes-macro-title">Hermes seguro: cliente remoto, agente confinado</title>
        <desc id="hermes-macro-desc">Arquitetura do acesso seguro ao Hermes: o Desktop na máquina Windows é apenas cliente gráfico e conecta por HTTP na porta 9119, autenticado por token, ao backend dentro de um container Docker na VM; os agentes acessam arquivos apenas por bind mount, e o acesso às pastas locais sensíveis é bloqueado na fronteira.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (painted first) -->
        <rect x="40" y="96" width="180" height="368" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="52" y="100" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="110" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">MÁQUINA LOCAL</text>

        <rect x="500" y="64" width="420" height="372" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="520" y="68" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="582" y="77" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">VM UBUNTU · SERVIDOR</text>

        <!-- Arrows (behind nodes) -->
        <!-- Permitted ingress: Desktop → gateway (HTTP) -->
        <line x1="200" y1="232" x2="232" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Authenticated arrival: gateway → backend (headline path) -->
        <path d="M 392,232 H 432 Q 440,232 440,224 V 136 Q 440,128 448,128 H 536"
              fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- Backend → memória -->
        <line x1="616" y1="160" x2="616" y2="188" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- Backend → ferramentas -->
        <path d="M 696,128 H 780 Q 788,128 788,136 V 188"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- Ferramentas → host FS (bind mount) -->
        <line x1="788" y1="252" x2="788" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- Forbidden path: agentes → pastas locais, stops at the boundary -->
        <path d="M 552,160 V 264 Q 552,272 544,272 H 420 Q 412,272 412,280 V 408 Q 412,416 404,416 H 234"
              fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <line x1="234" y1="406" x2="234" y2="426" stroke="#2d3142" stroke-width="2"/>

        <!-- Arrow labels (masked, 6-10px gap from their stroke) -->
        <rect x="446" y="172" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="478" y="181" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTENTICADO</text>

        <rect x="794" y="264" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="824" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIND MOUNT</text>

        <rect x="291" y="394" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="319" y="403" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOQUEADO</text>

        <!-- Node: Hermes Desktop (cliente) -->
        <rect x="40" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="200" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="48" y="206" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="62" y="215" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="120" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hermes Desktop</text>
        <text x="120" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cliente gráfico</text>

        <!-- Node: Gateway remoto (fronteira autenticada) -->
        <rect x="232" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="200" width="160" height="64" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="240" y="206" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="258" y="215" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="312" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway remoto</text>
        <text x="312" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">token · porta 9119</text>

        <!-- Node: Backend Hermes (focal) -->
        <rect x="536" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="96" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="544" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="562" y="111" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
        <text x="616" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend Hermes</text>
        <text x="616" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runtime · agentes</text>

        <!-- Node: Memória -->
        <rect x="560" y="188" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="188" width="136" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="568" y="194" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="586" y="203" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
        <text x="628" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memória</text>
        <text x="628" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">credenciais · sessões</text>

        <!-- Node: Ferramentas -->
        <rect x="720" y="188" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="188" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="728" y="194" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="746" y="203" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXEC</text>
        <text x="788" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ferramentas</text>
        <text x="788" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">execução de comandos</text>

        <!-- Node: Pasta do host -->
        <rect x="560" y="292" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="292" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="568" y="298" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="586" y="307" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="640" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pasta do host</text>
        <text x="640" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bind mount · /shared</text>

        <!-- Node: Pastas locais sensíveis -->
        <rect x="56" y="384" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="384" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="64" y="390" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="78" y="399" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOC</text>
        <text x="120" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pastas locais</text>
        <text x="120" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">documentos · senhas</text>

        <!-- Editorial aside -->
        <text x="40" y="486" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif', serif">Com o container na sua própria máquina, o desenho é o mesmo:</text>
        <text x="40" y="508" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', 'Noto Serif', serif">o Desktop continua só cliente.</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="120" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="140" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cliente · pastas locais</text>

        <rect x="252" y="548" width="14" height="10" rx="2" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="272" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fronteira (token)</text>

        <rect x="362" y="548" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="382" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend confinado</text>

        <rect x="468" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="488" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Memória · host</text>

        <rect x="566" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="586" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ferramentas</text>

        <line x1="120" y1="572" x2="148" y2="572" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="156" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP :9119 (rede)</text>

        <line x1="248" y1="572" x2="276" y2="572" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="284" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">acesso autenticado</text>

        <line x1="385" y1="572" x2="405" y2="572" stroke="#2d3142" stroke-width="1.2"/>
        <line x1="409" y1="566" x2="409" y2="578" stroke="#2d3142" stroke-width="2"/>
        <text x="417" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">acesso negado na fronteira</text>
      </svg>
    </div>
  </div>
</body>
</html>
