<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão remota · Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Fluxo · Conexão remota</p>
    <h1>Conectar o Hermes Desktop ao backend do container</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hermes-conexao-title hermes-conexao-desc">
        <title id="hermes-conexao-title">Fluxo de conexão do Desktop ao backend</title>
        <desc id="hermes-conexao-desc">Fluxograma em duas fases: no servidor, gerar o token, subir o serviço na porta 9119 e liberar o firewall; no PC Windows, configurar o gateway remoto com URL e token e testar a conexão até o agente responder pelo backend do container.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Stage eyebrows -->
        <text x="48" y="100" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SERVIDOR · VM / CONTAINER</text>
        <text x="48" y="364" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PC WINDOWS · DESKTOP</text>

        <!-- Arrows (behind nodes) -->
        <line x1="230" y1="150" x2="270" y2="150" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="570" y1="150" x2="595" y2="150" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- D1 "não" → firewall -->
        <path d="M 805,150 H 837 Q 845,150 845,158 V 244" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- D1 "sim" → fase Windows -->
        <path d="M 700,194 V 222 Q 700,230 692,230 H 208 Q 200,230 200,238 V 380" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- Firewall → configurar Desktop -->
        <path d="M 785,276 H 308 Q 300,276 300,284 V 380" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="412" x2="400" y2="412" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="640" y1="412" x2="690" y2="412" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- D2 "sim" → fim validado -->
        <line x1="790" y1="454" x2="790" y2="490" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- D2 "não" → rever URL e token -->
        <line x1="690" y1="430" x2="640" y2="430" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Arrow labels (masked, with gap from their stroke) -->
        <rect x="851" y="194" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="861" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NÃO</text>

        <rect x="170" y="274" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="180" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIM</text>

        <rect x="796" y="466" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="806" y="475" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIM</text>

        <rect x="651" y="440" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="661" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NÃO</text>

        <!-- Node: início (oval) -->
        <rect x="50" y="130" width="180" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="50" y="130" width="180" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="140" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Iniciar no servidor</text>

        <!-- Node: preparar o backend -->
        <rect x="270" y="112" width="300" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="270" y="112" width="300" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="278" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="296" y="127" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVE</text>
        <text x="420" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Preparar o backend</text>
        <text x="420" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">export HERMES_DASHBOARD_SESSION_TOKEN=…</text>
        <text x="420" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hermes serve --host 0.0.0.0 --port 9119 --tui</text>

        <!-- Node: decisão porta (diamond) -->
        <polygon points="700,106 805,150 700,194 595,150" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="700" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Porta liberada?</text>

        <!-- Node: firewall -->
        <rect x="785" y="244" width="130" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="785" y="244" width="130" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="793" y="250" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="807" y="259" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UFW</text>
        <text x="850" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Liberar porta</text>
        <text x="850" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ufw allow 9119/tcp</text>

        <!-- Node: configurar o Desktop -->
        <rect x="120" y="380" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="380" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="386" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="142" y="395" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DSK</text>
        <text x="240" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Configurar o Desktop</text>
        <text x="240" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Settings → Gateways</text>

        <!-- Node: informar URL e token -->
        <rect x="400" y="380" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="380" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="386" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="426" y="395" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONN</text>
        <text x="520" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Informar URL e token</text>
        <text x="520" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">http://IP:9119 · token</text>

        <!-- Node: decisão teste (diamond) -->
        <polygon points="790,370 890,412 790,454 690,412" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="790" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Respondeu?</text>

        <!-- Node: fim validado (oval, focal) -->
        <rect x="670" y="490" width="240" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="670" y="490" width="240" height="40" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="790" y="514" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agente responde pelo backend</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="120" y="548" width="24" height="14" rx="7" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="152" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Início / fim</text>

        <rect x="224" y="550" width="16" height="10" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="246" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ação</text>

        <polygon points="360,548 368,555 360,562 352,555" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="376" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decisão</text>

        <line x1="120" y1="572" x2="148" y2="572" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="156" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Caminho validado</text>

        <line x1="250" y1="572" x2="278" y2="572" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="286" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fluxo normal</text>
      </svg>
    </div>
  </div>
</body>
</html>
